<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>Hami Hamrah — homepage banner (portrait)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  /* Portrait twin of index.html, for viewports under 768px. It is a separate
     file rather than a parameter because the two compositions differ in layout,
     not just in size: side-by-side does not survive being squeezed into 4:5,
     and a shared abstraction would be harder to read than two small files. */

  @font-face {
    font-family: 'Vazirmatn';
    src: url('../../public/fonts/vazirmatn-arabic-wght-normal.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }

  html, body { margin: 0; padding: 0; background: #0B0204; }

  #root {
    position: relative;
    width: 1080px;
    height: 1350px;
    overflow: hidden;
    background: #0B0204;
    font-family: 'Vazirmatn', sans-serif;
  }

  .stack {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 78px;
  }

  /* ---- device ---- */
  .phone-wrap {
    position: relative;
    width: 338px;
    height: 676px;
  }

  .glow {
    position: absolute;
    left: 50%; top: 50%;
    width: 1300px; height: 1100px;
    margin-left: -650px; margin-top: -550px;
    background: radial-gradient(ellipse at center, rgba(130, 26, 38, 0.44) 0%, rgba(100, 2, 17, 0.18) 42%, rgba(11, 2, 4, 0) 70%);
  }

  .phone {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 44px;
    background: linear-gradient(145deg, #2a2024 0%, #141013 38%, #0d090b 100%);
    border: 2px solid rgba(229, 211, 179, 0.22);
    box-shadow: 0 48px 96px rgba(0, 0, 0, 0.75), inset 0 2px 0 rgba(229, 211, 179, 0.18);
    overflow: hidden;
  }

  .screen {
    position: absolute;
    inset: 12px;
    border-radius: 34px;
    background: linear-gradient(165deg, #F4E9D5 0%, #E5D3B3 58%, #CDB68E 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mark { width: 136px; }

  .sheen {
    position: absolute;
    left: -60%; top: -120%;
    width: 110%; height: 340%;
    background: linear-gradient(100deg, rgba(255,255,255,0) 38%, rgba(255,255,255,0.38) 50%, rgba(255,255,255,0) 62%);
  }

  .notch {
    position: absolute;
    top: 22px; left: 50%;
    margin-left: -48px;
    width: 96px; height: 11px;
    border-radius: 999px;
    background: rgba(11, 2, 4, 0.9);
    border: 1px solid rgba(229, 211, 179, 0.12);
  }

  /* ---- copy: centred under the device, sized to survive the scale down ---- */
  .copy { text-align: center; }

  .title {
    margin: 0;
    font-size: 132px;
    font-weight: 700;
    line-height: 1.3;
    color: #E5D3B3;
  }

  .rule {
    width: 300px; height: 4px;
    margin: 34px auto 0;
    background: linear-gradient(to left, rgba(229, 211, 179, 0), #E5D3B3, rgba(229, 211, 179, 0));
    transform-origin: center;
  }

  .tagline {
    margin: 34px 0 0;
    font-size: 62px;
    font-weight: 500;
    line-height: 1.6;
    color: #E5D3B3;
    opacity: 0.92;
  }

  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, rgba(11,2,4,0) 58%, rgba(11,2,4,0.72) 100%);
  }
</style>
</head>
<body>
  <div id="root" data-composition-id="BannerPortrait" data-width="1080" data-height="1350" data-duration="8">
    <div class="stack">
      <div class="phone-wrap">
        <div class="glow"></div>
        <div class="phone">
          <div class="screen">
            <img class="mark" src="../../public/brand/hami-mark-alpha.png" alt="">
          </div>
          <div class="notch"></div>
          <div class="sheen"></div>
        </div>
      </div>

      <div class="copy">
        <h1 class="title">حامی همراه</h1>
        <div class="rule"></div>
        <p class="tagline">اطمینان در انتخاب</p>
      </div>
    </div>

    <div class="vignette"></div>
  </div>

<script>
  const tl = gsap.timeline({ paused: true });

  tl.fromTo('.phone-wrap',
      { x: -620, rotate: -14, opacity: 0 },
      { x: 0, rotate: -6, opacity: 1, duration: 1.7, ease: 'power3.out' }, 0.15)

    .fromTo('.title',
      { y: 64, opacity: 0 },
      { y: 0, opacity: 1, duration: 1.0, ease: 'power2.out' }, 0.95)
    .fromTo('.rule',
      { scaleX: 0 },
      { scaleX: 1, duration: 0.9, ease: 'power2.inOut' }, 1.35)
    .fromTo('.tagline',
      { y: 34, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.9, ease: 'power2.out' }, 1.5)

    .to('.phone-wrap', { rotate: 1.5, y: -22, duration: 4.1, ease: 'sine.inOut' }, 1.85)
    .fromTo('.sheen',
      { y: '-34%' },
      { y: '34%', duration: 3.4, ease: 'sine.inOut' }, 2.1)

    .to(['.title', '.rule', '.tagline'],
      { opacity: 0, y: -34, duration: 0.75, ease: 'power2.in' }, 6.55)
    .to('.phone-wrap',
      { x: 620, rotate: 12, opacity: 0, duration: 1.0, ease: 'power3.in' }, 6.7);

  function tick(timeMs) {
    tl.seek(timeMs / 1000);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
