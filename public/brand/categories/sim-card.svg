<svg width="800" height="960" viewBox="0 0 800 960" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-sim-card" x1="120" y1="60" x2="680" y2="880" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14080B"/>
      <stop offset="0.48" stop-color="#2B050D"/>
      <stop offset="1" stop-color="#09070A"/>
    </linearGradient>
    <radialGradient id="glow-sim-card" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 180) rotate(42) scale(430 420)">
      <stop stop-color="#F6E5C5" stop-opacity="0.32"/>
      <stop offset="0.4" stop-color="#C11E3A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sim-body" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="rgba(245,228,196,0.16)"/>
      <stop offset="0.55" stop-color="rgba(245,228,196,0.06)"/>
      <stop offset="1" stop-color="rgba(245,228,196,0.12)"/>
    </linearGradient>
    <linearGradient id="sim-chip" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F6E5C5"/>
      <stop offset="1" stop-color="#C5A880"/>
    </linearGradient>
  </defs>

  <rect width="800" height="960" rx="40" fill="url(#bg-sim-card)"/>
  <rect width="800" height="960" rx="40" fill="url(#glow-sim-card)"/>
  <circle cx="122" cy="120" r="3.5" fill="#C11E3A"/>

  <!-- Full-size card, cut corner top-right as the physical card is. -->
  <g transform="translate(150 300)">
    <path d="M0 34A34 34 0 0 1 34 0h320l96 96v430a34 34 0 0 1-34 34H34A34 34 0 0 1 0 526V34Z"
          fill="url(#sim-body)" stroke="rgba(245,228,196,0.4)" stroke-width="3"/>
    <path d="M354 0l96 96h-96V0Z" fill="rgba(255,255,255,0.06)" stroke="rgba(245,228,196,0.28)" stroke-width="2.5"/>

    <!-- The chip, with its contact lanes. -->
    <g transform="translate(96 176)">
      <rect width="200" height="150" rx="20" fill="url(#sim-chip)"/>
      <g stroke="#2B050D" stroke-width="4" stroke-opacity="0.55">
        <path d="M0 50h200M0 100h200"/>
        <path d="M66 0v150M134 0v150"/>
      </g>
      <rect x="76" y="58" width="48" height="34" rx="7" fill="#2B050D" fill-opacity="0.7"/>
    </g>

    <!-- Punch-out outline showing the nano SIM nested inside, which is what makes the object legible. -->
    <g transform="translate(252 356)" stroke="rgba(245,228,196,0.32)" stroke-width="2.5" fill="none">
      <path d="M0 22A22 22 0 0 1 22 0h104l34 34v96a22 22 0 0 1-22 22H22A22 22 0 0 1 0 130V22Z"/>
      <rect x="42" y="42" width="60" height="46" rx="8" fill="rgba(169,25,52,0.55)" stroke="none"/>
    </g>

    <rect x="48" y="392" width="150" height="6" rx="3" fill="rgba(245,228,196,0.26)"/>
    <rect x="48" y="416" width="96" height="6" rx="3" fill="rgba(245,228,196,0.16)"/>
  </g>

  <rect x="96" y="742" width="608" height="1" fill="rgba(245,228,196,0.18)"/>
</svg>
